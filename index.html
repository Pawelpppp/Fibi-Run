<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Fibi Run</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0c0818;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }
        /* telefon w pionie: komunikat na wierzchu, gra zatrzymana (włącza JS, tylko dotyk) */
        #rotate { display: none; position: fixed; inset: 0; z-index: 10000; background: #0c0818;
            flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            font-family: monospace; color: #ffd040; text-align: center; padding: 24px; box-sizing: border-box; }
        #rotate.show { display: flex; }
        #rotate .rotate-text { font-size: 16px; line-height: 1.8; font-weight: bold; text-shadow: 2px 2px 0 #5a2a10; }
        #rotate .rotate-sub { font-size: 10px; color: #c8b890; letter-spacing: 1px; }
        #rotate .rotate-phone { width: 44px; height: 76px; border: 4px solid #ffe8a0; border-radius: 8px; box-sizing: border-box;
            padding: 6px 4px; animation: rotate-phone 1.8s ease-in-out infinite; }
        #rotate .rotate-screen { width: 100%; height: 100%; background: #3a2a50; }
        @keyframes rotate-phone { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
        #fibi-nick-input {
            position: fixed;
            z-index: 30;
            margin: 0;
            padding: 0 4px;
            border: 0;
            outline: none;
            background: transparent;
            color: transparent;
            caret-color: #ffd040;
            font-family: monospace;
            font-size: 16px;
            text-transform: uppercase;
            opacity: 0;
            /* pole jest nad ramką nicku, żeby na telefonie otworzyć klawiaturę */
        }
        #fibi-nick-input:focus { opacity: 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <noscript>Fibi Run wymaga włączonego JavaScriptu.</noscript>
    <!-- grafiki jako data-URI (działa też z file://); generowane przez tools/process_assets.py -->
    <script src="assets/game/assets.js"></script>
    <script src="audio.js"></script>
    <script src="leaderboard.js"></script>
    <script src="version.js"></script>
    <script src="game.js"></script>
</body>
</html>
